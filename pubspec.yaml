name: flutty_notifications
description: "Push notifications (FCM + APNs) for Flutter apps: contextual permission, device token lifecycle, foreground display and tap routing."
version: 0.1.1
homepage: https://github.com/Flutty-Lab/flutty_notifications
repository: https://github.com/Flutty-Lab/flutty_notifications
issue_tracker: https://github.com/Flutty-Lab/flutty_notifications/issues

topics:
  - notifications
  - firebase
  - fcm
  - push-notifications

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"


dependencies:
  app_badge_plus: ^1.3.4
  app_settings: ^9.0.0
  device_info_plus: ^13.0.0
  firebase_messaging: ^17.0.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.0
  permission_handler: ^13.0.0
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
